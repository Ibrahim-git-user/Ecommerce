services:
  redpanda: # Lightweight drop-in Kafka replacement for local development
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    command: >
      redpanda start --smp 1 --memory 1G --reserve-memory 0M --overprovisioned --node-id 0
      --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: postgres 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the script so Postgres executes it on initial boot
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql


  auth-service:
    build:
      context: ./AuthService
      dockerfile: ../Dockerfile
    ports:
      - "8000:8000"
      - "5679:5679"
    command: >
      sh -c "python manage.py migrate --noinput && gunicorn AuthService.wsgi:application --bind 0.0.0.0:8000"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: django-insecure-_u**$$d6iiia%4hzu^slipe%xj5e98%4%77k+w_csy=-0g##-#w
    depends_on:
      - db

  order-service:
    build:
      context: ./OrderMicroservice
      dockerfile: ../Dockerfile
    ports:
      - "8001:8001"
      - "5678:5678"
    command: >
      sh -c "python manage.py migrate --noinput && gunicorn OrderMicroservice.wsgi:application --bind 0.0.0.0:8001 --timeout 0"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      JWT_SECRET_KEY: django-insecure-_u**$$d6iiia%4hzu^slipe%xj5e98%4%77k+w_csy=-0g##-#w
    depends_on:
      - db
      - redpanda

  order-service-payment-event-consumer:
    build:
      context: ./OrderMicroservice
      dockerfile: ../Dockerfile
    ports:
      - "5680:5680"
    command: >
      sh -c "python manage.py consume_payment_events"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      - db
      - redpanda

  payment-service:
    build:
      context: ./PaymentMicroservice
      dockerfile: ../Dockerfile
    ports:
      - "8002:8002"
      - "5682:5682"
    command: >
      sh -c "python manage.py migrate --noinput && gunicorn PaymentMicroservice.wsgi:application --bind 0.0.0.0:8002"
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      - db
      - redpanda

  payment-service-order-event-consumer:
    build:
      context: ./PaymentMicroservice
      dockerfile: ../Dockerfile
    ports:
      - "5681:5681"
    command: >
      sh -c "python manage.py consume_order_events"
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      - db
      - redpanda

  frontend:
    build:
      context: ./ProductCatalog
      dockerfile: Dockerfile
    ports:
      - "5173:5173"

volumes:
  postgres_data: